services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: incidentes_ic
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_segura
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data

volumes:
  postgres_data:
