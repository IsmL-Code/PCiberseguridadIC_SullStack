services:
  - type: web
    name: incidentes-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build && npm run migrate:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_URL
        value: https://incidentes-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - type: web
    name: incidentes-web
    runtime: static
    rootDir: frontend/mi-proyecto-plataformas
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://incidentes-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
