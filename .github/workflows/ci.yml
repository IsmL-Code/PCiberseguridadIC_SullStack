name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, migrate)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
      JWT_SECRET: ci-test-secret-con-al-menos-32-caracteres
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:jest

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/mi-proyecto-plataformas
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.ejemplo.com' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/mi-proyecto-plataformas/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy a Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
    steps:
      - name: Deploy backend
        run: |
          if [ -z "$BACKEND_HOOK" ]; then echo "::warning::Falta el secreto RENDER_BACKEND_DEPLOY_HOOK; se omite el despliegue."; else curl -fsS -X POST "$BACKEND_HOOK"; fi
      - name: Deploy frontend
        run: |
          if [ -z "$FRONTEND_HOOK" ]; then echo "::warning::Falta el secreto RENDER_FRONTEND_DEPLOY_HOOK; se omite el despliegue."; else curl -fsS -X POST "$FRONTEND_HOOK"; fi